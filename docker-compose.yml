services:
  tekskil_server_case_ui:
    image: ghcr.io/tekskilcode/tcs_ui:v1.2.0
    network_mode: "host"
    privileged: true
    volumes:
      # Application data volumes only (no source code)
      - /home/tch/apps/tcs_ui/tcs_ui_pipe:/app/compipe
      - /home/tch/apps/tcs_ui/version:/app/tcs_version
      - /home/tch/apps/docker/tkskl-server/.env:/app/tkskl-server/version.txt
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=case_ui.settings
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:6969')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  tekskil_discovery_broadcast:
    image: ghcr.io/tekskilcode/tkskl_discovery_broadcast:v1.0.0
    network_mode: "host"
    volumes:
    - /home/tch/apps/tcs_ui/version:/app/tcs_version
    - /home/tch/apps/docker/tkskl-server/.env:/app/tkskl-server/version.txt
    restart: unless-stopped 



